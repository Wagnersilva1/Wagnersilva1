<svg xmlns="http://www.w3.org/2000/svg" width="780" height="164" viewBox="0 0 780 164" role="img" aria-labelledby="title">
  <title id="title">React, Node.js, TypeScript, Lua e Git saltando em sequência</title>
  <style>
    .runner { animation: leap 10s linear infinite; }
    @keyframes leap {
      0%, 12%  { transform: translate(130px, 110px); }
      20%, 32% { transform: translate(260px, 110px); }
      40%, 52% { transform: translate(390px, 110px); }
      60%, 72% { transform: translate(520px, 110px); }
      80%, 92% { transform: translate(650px, 110px); }
      93%      { transform: translate(632px, 75px) rotate(-7deg); }
      95%      { transform: translate(495px, 48px) rotate(-3deg); }
      97%      { transform: translate(285px, 48px) rotate(3deg); }
      99%      { transform: translate(148px, 75px) rotate(7deg); }
      100%     { transform: translate(130px, 110px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .runner { animation: none; }
    }
  </style>
